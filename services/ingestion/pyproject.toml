[project]
name = "cwd-ingestion"
version = "0.1.0"
description = "Step Functions ingestion task handlers."
requires-python = ">=3.12"
dependencies = [
    "cwd-common",
    "pillow>=12.1.1",
    "pymupdf>=1.27.2.2",
    "pysbd>=0.3.4",
]

[tool.uv.sources]
cwd-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion"]
