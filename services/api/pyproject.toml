[project]
name = "cwd-api"
version = "0.1.0"
description = "HTTP API Lambda handlers."
requires-python = ">=3.12"
dependencies = ["cwd-common"]

[tool.uv.sources]
cwd-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api"]
