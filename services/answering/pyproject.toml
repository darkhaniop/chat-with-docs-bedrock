[project]
name = "cwd-answering"
version = "0.1.0"
description = "SQS worker: rewrite -> retrieve -> generate -> stream."
requires-python = ">=3.12"
dependencies = ["cwd-common"]

[tool.uv.sources]
cwd-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["answering"]
