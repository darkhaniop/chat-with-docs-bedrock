[project]
name = "cwd-common"
version = "0.1.0"
description = "Shared config, DynamoDB/S3/Bedrock adapters used by every Lambda package."
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common"]
